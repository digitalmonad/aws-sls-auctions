name: Deploy auctions service

on:
  push:
    branches:
      - main
    paths:
      - "services/auctions/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/deploy-auctions.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: Serverless stage to deploy
        required: true
        default: dev
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-auctions-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1

jobs:
  deploy:
    name: Deploy auctions
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Deploy with Serverless Framework
        working-directory: services/auctions
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: pnpm exec serverless deploy --stage "${{ inputs.stage || 'dev' }}"
